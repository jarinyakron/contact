<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us | L.C.C</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --brand-dark: #0b2238;
      --brand-main: #0f2a44;
      --brand-soft: #163a5f;
      --white: #ffffff;
      --black: #0b0b0b;
    }

    *{ box-sizing: border-box; }

    body{
      margin:0;
      font-family:'Mitr', sans-serif;
      background: linear-gradient(180deg, var(--brand-main), var(--brand-dark));
      color:#ffffff;
    }

    main.wrap{
      max-width: 1100px;
      margin: 0 auto;
      padding: 52px 20px 42px;
    }

    /* ===== Header ===== */
    .contact-center{
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      margin-bottom: 22px;
    }

    .logo-top{
      width: 110px;
      margin-bottom: 8px;
    }

    .title{
      font-size: 34px;
      font-weight: 300;
      letter-spacing: 1px;
      margin: 0 0 20px;
    }

    /* ===== Contact Buttons ===== */
    .contact-list{
      width:100%;
      max-width: 380px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .contact-btn{
      display:flex;
      align-items:center;
      gap:12px;
      padding: 14px 20px;
      border-radius: 999px;
      background: rgba(255,255,255,.96);
      color: var(--brand-dark);
      text-decoration:none;
      font-weight:300;
      font-size:15px;
      box-shadow: 0 8px 20px rgba(0,0,0,.22);
      transition: .25s ease;
    }

    .contact-btn img{
      width:20px;
      height:20px;
    }

    .contact-btn:hover{
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(0,0,0,.32);
    }

    /* ===== Map Section ===== */
    .sub{
      text-align:center;
      margin: 26px 0 18px;
      font-weight:300;
      letter-spacing:.5px;
      opacity:.9;
    }

    .map{
      width:100%;
      height:360px;
      border-radius:24px;
      overflow:hidden;
      box-shadow:0 18px 42px rgba(0,0,0,.35);
      margin-bottom: 18px;
      background:#fff;
    }

    /* ===== Buttons Below Map ===== */
    .btn-row{
      display:flex;
      justify-content:center;
      gap:14px;
      flex-wrap:wrap;
    }

    .btn{
      padding: 12px 28px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.6);
      color:#ffffff;
      text-decoration:none;
      font-size:14px;
      font-weight:300;
      transition:.25s ease;
    }

    .btn:hover{
      background:#ffffff;
      color: var(--brand-dark);
    }

    /* ===== Footer ===== */
    footer.footer-section{
      background: var(--brand-dark);
      padding: 40px 20px 22px;
      border-top: 1px solid rgba(255,255,255,.15);
    }

    .footer-container{
      max-width:1100px;
      margin:0 auto;
      text-align:center;
    }

    .footer-logo{
      width: 95px;
      margin-bottom: 10px;
    }

    .footer-left h2{
      font-size:18px;
      font-weight:400;
      margin-bottom:8px;
    }

    .footer-left p{
      font-size:14px;
      line-height:1.6;
      font-weight:300;
      opacity:.9;
    }

    .footer-copy{
      text-align:center;
      margin-top: 18px;
      font-size:12.5px;
      opacity:.75;
    }

    @media (max-width: 820px){
      .title{ font-size:30px; }
      .map{ height:320px; }
    }
  </style>
</head>

<body>

</body>
