<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ชำระเงิน | L.C.C</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      font-family:'Mitr', sans-serif;
      background: linear-gradient(180deg, #001faaef, #ffbb00);
      min-height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      color:#ffffff;
    }

    h1{
      font-size:24px;
      font-weight:600;
      margin-bottom:16px;
    }

    .qr{
      width:90%;
      max-width:280px;
      border-radius:20px;
      box-shadow:0 12px 30px rgba(0,0,0,.35);
      margin-bottom:16px;
    }

    .desc{
      font-size:14px;
      opacity:.9;
      margin-bottom:20px;
    }

    .back{
      display:inline-block;
      padding:10px 28px;
      border-radius:999px;
      border:1.5px solid #ffffff;
      text-decoration:none;
      font-size:14px;
      color:#ffffff;
      transition:.25s;
    }

    .back:hover{
      background:#ffffff;
      color:#001faaef;
    }
  </style>
</head>

<body>

  <h1>สแกน QR Code</h1>

  <img src="image/620721.jpg" class="qr" alt="QR Code ชำระเงิน">

  <p class="desc">
    สำหรับชำระเงินงาน 40 ปี L.C.C
  </p>

  <a href="index.html" class="back">
    ← ติดต่อเรา
  </a>

</body>
</html>
