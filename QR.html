<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ชำระเงิน</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: "Prompt", sans-serif;
      background: #ffe6f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: white;
      padding: 20px;
      border-radius: 20px;
      text-align: center;
      max-width: 350px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }
    h2 {
      color: #e91e63;
      margin-bottom: 10px;
    }
    img {
      width: 100%;
      max-width: 280px;
      border-radius: 10px;
    }
    p {
      margin-top: 10px;
      color: #555;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>สแกน QR Code</h2>
    <img src="image/620721.jpg" alt="QR Code">
    <p>เพื่อชำระเงินงาน 40 ปี LCC</p>
  </div>

</body>
</html>
